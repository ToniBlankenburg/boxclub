<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Boxclub Mitgliederverwaltung</title>
</head>
<body class="bg-neutral-50 text-neutral-900 antialiased">
<header class="flex flex-wrap items-center gap-x-6 gap-y-2 border-b border-neutral-200 bg-white px-6 py-4">
    <h1 class="text-base font-semibold">Boxclub Mitgliederverwaltung</h1>
    <!-- Die Bereichsnavigation rendert das Backend: jede Antwort, die den
         Bereich wechseln kann, liefert sie per hx-swap-oob mit und ersetzt
         dieses Element. Der erste Aufruf unten füllt es. -->
    <nav id="navigation" aria-label="Bereiche"></nav>
</header>

<!-- Der gesamte Inhalt kommt als HTML-Fragment aus dem Go-Backend. -->
<main id="inhalt" class="mx-auto max-w-5xl px-6 py-6"
      hx-get="/api/mitglieder" hx-trigger="load" hx-swap="innerHTML">
    <p class="text-sm text-neutral-500">Laden …</p>
</main>

<script src="./src/main.js" type="module"></script>
</body>
</html>
