name: macOS-Build

# Baut das .app-Bundle auf macos-latest statt auf einem gelegentlich
# zugänglichen Mac — Begründung: .scratch/boxclub-v1/issues/11-mac-release-build.md.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Wails-CLI installieren
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: App bauen
        run: wails build -platform darwin/universal -clean

      # Ad-hoc-Signatur (Apple Developer ID/Notarisierung ist v1.5, siehe Ticket).
      - name: Ad-hoc signieren
        run: codesign --force --deep --sign - build/bin/boxclub.app

      - uses: actions/upload-artifact@v4
        with:
          name: boxclub-macos
          path: build/bin/boxclub.app
