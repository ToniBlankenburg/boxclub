name: macOS-Build

# Baut das .app-Bundle auf macos-latest statt auf einem gelegentlich
# zugänglichen Mac — Begründung: .scratch/boxclub-v1/issues/11-mac-release-build.md.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Wails-CLI installieren
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: App bauen
        run: wails build -platform darwin/universal -clean

      # Ad-hoc-Signatur (Apple Developer ID/Notarisierung ist v1.5, siehe Ticket).
      - name: Ad-hoc signieren
        run: codesign --force --deep --sign - build/bin/boxclub.app

      - uses: actions/upload-artifact@v4
        with:
          name: boxclub-macos
          path: build/bin/boxclub.app

      # Zip statt tar/actions/upload-artifact-Download: ditto erhält Rechte und
      # Resource-Forks des .app-Bundles, ein normales zip/tar tut das nicht
      # zuverlässig.
      - name: Bundle für Release zippen
        if: startsWith(github.ref, 'refs/tags/')
        run: ditto -c -k --sequesterRsrc --keepParent build/bin/boxclub.app boxclub-macos.zip

      # Nur bei einem Tag-Push: Release, an das jeder mit einem Mac direkt
      # über den Browser-Link kommt — ohne gh-CLI, ohne GitHub-Login (Repo ist
      # öffentlich). Reine Actions-Artefakte verlangen dagegen immer einen
      # eingeloggten Account.
      - name: GitHub-Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: boxclub-macos.zip
          draft: true
